name: Build MTA Voice Bridge

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Generate Visual Studio project
        shell: cmd
        run: utils\premake5 vs2019

      - name: Build Windows x64 DLL
        shell: cmd
        run: |
          msbuild Build\Base.sln /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal

      - name: Verify DLL
        shell: pwsh
        run: |
          $dll = "Bin/Release/ml_voicebridge.dll"

          if (!(Test-Path $dll)) {
            Write-Error "DLL not found: $dll"
            Get-ChildItem Bin -Recurse
            exit 1
          }

          Write-Host "DLL successfully built:"
          Get-Item $dll

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: ml_voicebridge-windows-x64
          path: Bin/Release/ml_voicebridge.dll
          if-no-files-found: error
