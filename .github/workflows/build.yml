
name: Build MTA Voice Bridge

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Generate Visual Studio project
        shell: cmd
        run: utils\premake5 vs2019

      - name: Build Windows x64
        shell: cmd
        run: msbuild Build\Base.sln /m /p:Configuration=Release /p:Platform=Win32 /verbosity:minimal

      - name: List build output
        shell: pwsh
        run: |
          if (Test-Path Bin) {
            Get-ChildItem Bin -Recurse
          } else {
            Write-Error "Bin directory was not generated."
            exit 1
          }

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: mta-voice-bridge-windows-x64
          path: Bin/**
          if-no-files-found: error
